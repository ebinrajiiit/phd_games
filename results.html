<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room results</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Projector view: light page only (projectors wash out dark themes) */
  :root{--ground:#FFFFFF;--paper:#FFFFFF;--ink:#1C2430;--muted:#5B6573;--rule:#D3D9E0;--red:#C42B1C;--blue:#2357C6}
  body{font-size:20px;background:#fff}
  .wrap{max-width:1640px;margin:0 auto;padding:22px 48px 40px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:2px solid var(--ink);padding-bottom:12px;flex-wrap:wrap}
  .top .kicker{margin:0;color:var(--muted);font-size:17px}
  .top h1{font-size:40px;margin:2px 0 0}
  .tabs{display:flex;gap:26px}
  .tab{background:none;border:0;padding:6px 0;font:700 18px/1 var(--ui);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .live{color:var(--muted);font-size:15px;margin:8px 0 0;text-align:right}
  .kpi{font:400 46px/1.25 var(--serif);margin:26px 0 22px;max-width:28em}
  .kpi b{font-weight:600}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;align-items:start}
  h2{font:600 22px/1.3 var(--serif);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .hist{display:flex;align-items:flex-end;gap:10px;height:250px;padding-top:28px}
  .hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
  .hbar{width:100%;background:var(--ink)}
  .hn{font-size:17px;font-weight:700}
  .hx{font-size:16px;color:var(--muted);border-top:1px solid var(--ink);width:100%;text-align:center;padding-top:6px}
  ol.lb{list-style:none;margin:0;padding:0}
  ol.lb li{display:grid;grid-template-columns:44px 1fr auto;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule)}
  .rk{font:600 26px/1 var(--serif);color:var(--muted)}
  li:first-child .rk{color:var(--ink)}
  .nm{font:400 26px/1.2 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
  .reveal{margin:36px 0 0;display:flex;align-items:center;gap:18px;border-top:2px solid var(--ink);padding-top:18px}
  .rbtn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:12px 20px;font:700 18px/1 var(--ui);cursor:pointer}
  .rbtn.ghost{background:#fff;color:var(--ink)}
  .reveal span{color:var(--muted);font-size:17px}
  .headline{font:600 40px/1.25 var(--serif);color:var(--red);margin:22px 0 6px;max-width:30em}
  .subhead{color:var(--muted);margin:0 0 10px}
  .q{display:grid;grid-template-columns:minmax(300px,2.2fr) 150px 3fr 80px;align-items:center;gap:18px;padding:10px 0;border-bottom:1px solid var(--rule)}
  .q .lab{font:400 21px/1.3 var(--serif)}
  .q .lab.struck{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
  .q .truth{font-weight:700;font-size:16px}
  .t-real,.t-human{color:var(--blue)} .t-fake,.t-machine{color:var(--red)}
  .track{height:14px;background:#EEF1F4}
  .fill{height:100%;background:var(--ink)}
  .fill.low{background:var(--red)}
  .pct{font-weight:700;text-align:right;font-size:22px;font-variant-numeric:tabular-nums}
  .duel{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 48px}
  .pc{border-top:1px solid var(--rule);padding-top:12px}
  .pc .head{display:grid;grid-template-columns:44px 1fr auto;align-items:baseline;gap:12px}
  .pc .wk{color:var(--muted);font-size:17px;margin:4px 0 8px 56px}
  .pc .txt{font:400 18px/1.55 var(--serif);white-space:pre-wrap;word-wrap:break-word;border-left:3px solid var(--ink);padding-left:14px;margin-left:56px;max-height:11em;overflow:auto}
  .callout{border-left:4px solid var(--red);padding:6px 0 6px 18px;margin:34px 0 0}
  .callout p{margin:0}
  .callout .big{font:600 32px/1.3 var(--serif);color:var(--red);margin-bottom:6px}
  .empty{font:italic 400 30px/1.4 var(--serif);color:var(--muted);padding:40px 0}
  .setup{border-left:4px solid var(--red);padding:8px 0 8px 18px;margin-top:30px}
  .setup code{background:#EEF1F4;padding:1px 6px;border-radius:3px}
  @media (max-width:1000px){.wrap{padding:16px 18px}.cols,.duel{grid-template-columns:1fr;gap:28px}.kpi{font-size:30px}.headline{font-size:28px}.q{grid-template-columns:1fr 110px}.q .track{grid-column:1/-1}.pc .wk,.pc .txt{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <p class="kicker">Room results</p>
      <h1 id="gname"></h1>
    </div>
    <div>
      <div class="tabs" id="tabs">
        <button class="tab" data-g="ref">Reference Hunt</button>
        <button class="tab" data-g="hom">Human or Machine?</button>
        <button class="tab" data-g="duel">Prompt Duel</button>
      </div>
      <p class="live"><span id="sess"></span>, <span id="upd">connecting</span></p>
    </div>
  </div>
  <main id="main"></main>
</div>

<script src="config.js"></script>
<script src="results-client.js"></script>
<script>
const params=new URLSearchParams(location.search);
const SESSION=params.get("session")||Results.session;
const NAMES={ref:"Reference Hunt",hom:"Human or Machine?",duel:"Prompt Duel"};
let game=params.get("game")||"ref";
const revealed={ref:false,hom:false};
let lastRows=[], timer=null;

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=String(text);return e}
function plural(n,one,many){return n+" "+(n===1?one:many)}
function setTab(g){game=g;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.g===g));
  document.getElementById("gname").textContent=NAMES[g];
  const u=new URL(location);u.searchParams.set("game",g);history.replaceState(null,"",u);load()}

document.getElementById("sess").textContent="session “"+SESSION+"”";
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.g));

async function load(){
  clearTimeout(timer);
  const main=document.getElementById("main");
  if(!Results.ready){
    main.replaceChildren();
    const s=el("div","setup");
    s.innerHTML="<p><b>The room screen isn't connected.</b> Add <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> to <code>config.js</code>, and run <code>supabase.sql</code> once in the Supabase SQL Editor.</p>";
    main.append(s);document.getElementById("upd").textContent="not connected";return;
  }
  try{
    const rows=await Results.fetchGame(game,SESSION);
    lastRows=rows;render(rows);
    document.getElementById("upd").textContent="updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }catch(e){document.getElementById("upd").textContent="can't reach the database, retrying"}
  timer=setTimeout(load,3000);
}

function render(rows){
  const main=document.getElementById("main");main.replaceChildren();
  if(game==="duel")return renderDuel(main,rows);
  const total=rows.length?Math.max(...rows.map(r=>r.total)):(game==="ref"?10:8);
  const n=rows.length;
  if(!n){main.append(el("p","empty","No results yet. Scan the code on the slide to play."));return}
  const avg=rows.reduce((a,r)=>a+r.score,0)/n;
  const best=Math.max(...rows.map(r=>r.score));

  const k=el("p","kpi");
  k.append(el("b",null,plural(n,"player","players")+"."),document.createTextNode(" The room averaged "),
    el("b",null,avg.toFixed(1)+" out of "+total),document.createTextNode(". The top score was "+best+"."));
  main.append(k);

  const cols=el("div","cols");
  const hp=el("section");hp.append(el("h2",null,"How the room scored"));
  const counts=Array(total+1).fill(0);rows.forEach(r=>{if(r.score>=0&&r.score<=total)counts[r.score]++});
  const mx=Math.max(...counts,1);const hist=el("div","hist");
  counts.forEach((c,s)=>{const col=el("div","hcol");col.append(el("div","hn",c||""));
    const b=el("div","hbar");b.style.height=(c/mx*100)+"%";col.append(b);col.append(el("div","hx",s));hist.append(col)});
  hp.append(hist);cols.append(hp);

  const lp=el("section");lp.append(el("h2",null,"Highest scores"));
  const ol=el("ol","lb");
  rows.slice().sort((a,b)=>b.score-a.score||new Date(a.created_at)-new Date(b.created_at)).slice(0,5).forEach((r,i)=>{
    const li=el("li");li.append(el("span","rk",i+1),el("span","nm",r.nickname),el("span","sc",r.score+" / "+r.total));ol.append(li)});
  lp.append(ol);cols.append(lp);
  main.append(cols);

  const rv=el("div","reveal");
  const btn=el("button","rbtn"+(revealed[game]?" ghost":""),revealed[game]?"Hide the answers":"Show the answers");
  btn.onclick=()=>{revealed[game]=!revealed[game];render(lastRows)};
  rv.append(btn);
  if(!revealed[game])rv.append(el("span",null,"Wait until everyone has finished: this shows which items were real."));
  main.append(rv);

  if(revealed[game]){
    const stats={};
    rows.forEach(r=>(r.answers||[]).forEach(a=>{const s=stats[a.id]||(stats[a.id]={label:a.label,truth:a.truth,n:0,ok:0});s.n++;if(a.correct)s.ok++}));
    const list=Object.values(stats).map(s=>Object.assign(s,{p:s.n?s.ok/s.n:0})).sort((a,b)=>a.p-b.p);
    if(list.length){
      const w=list[0], pw=Math.round((1-w.p)*100);
      const line= w.truth==="Hallucinated"?pw+"% of the room believed “"+w.label+"” was a real paper."
        : w.truth==="Real"?pw+"% of the room thought “"+w.label+"” was invented. It's real."
        : pw+"% of the room got “"+w.label+"” wrong.";
      main.append(el("p","headline",line));
      main.append(el("p","subhead","Share of the room that answered each one correctly, hardest first."));
      list.forEach(s=>{const q=el("div","q");
        const fake=s.truth==="Hallucinated";
        q.append(el("span","lab"+(fake?" struck":""),s.label));
        const tc={"Real":"t-real","Hallucinated":"t-fake","Human":"t-human","Machine":"t-machine"}[s.truth]||"";
        q.append(el("span","truth "+tc,{"Real":"Real","Hallucinated":"Hallucinated","Human":"Researcher","Machine":"LLM"}[s.truth]||s.truth));
        const tr=el("div","track");const f=el("div","fill"+(s.p<0.5?" low":""));f.style.width=(s.p*100)+"%";tr.append(f);q.append(tr);
        q.append(el("span","pct",Math.round(s.p*100)+"%"));main.append(q)});
    }
  }
}

function renderDuel(main,rows){
  const n=rows.length;
  if(!n){main.append(el("p","empty","No prompts yet. Scan the code on the slide to play."));return}
  const best=Math.max(...rows.map(r=>r.score));
  const k=el("p","kpi");
  k.append(el("b",null,plural(n,"team","teams")),document.createTextNode(" rebuilt a weak prompt. The strongest scored "),el("b",null,best+" out of 100"),document.createTextNode("."));
  main.append(k);
  main.append(el("h2",null,"Vote for the prompt that would get the most useful answer"));
  const grid=el("div","duel");
  rows.slice().sort((a,b)=>b.score-a.score||new Date(a.created_at)-new Date(b.created_at)).slice(0,6).forEach((r,i)=>{
    const c=el("div","pc");const head=el("div","head");
    head.append(el("span","rk",i+1),el("span","nm",r.nickname),el("span","sc",r.score+" / 100"));c.append(head);
    if(r.weak_prompt)c.append(el("p","wk","Rebuilt from “"+r.weak_prompt+"”"));
    c.append(el("div","txt",r.prompt||""));grid.append(c)});
  main.append(grid);
  const rw=rows.filter(r=>r.weak_prompt==="Write my related work section.").length;
  if(rw){const t=el("div","callout");
    t.append(el("p","big",plural(rw,"team","teams")+" tried to strengthen “Write my related work section.”"));
    t.append(el("p",null,"Ask them what the app told them. The strongest version of that prompt is not to send it."));main.append(t)}
}

setTab(["ref","hom","duel"].includes(game)?game:"ref");
</script>
</body>
</html>
